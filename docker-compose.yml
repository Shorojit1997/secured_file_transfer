name: secured-file-transfer

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
    volumes:
      - mailpit-data:/data

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379
      BLOB_ROOT: /data/blobs
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      TRUSTED_PROXY_HOPS: 1
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?run openssl rand -base64 32 and set it in .env}
      EMAIL_LOOKUP_PEPPER: ${EMAIL_LOOKUP_PEPPER:?run openssl rand -base64 32 and set it in .env}
    volumes:
      - blob-data:/data

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '${APP_PORT:-8080}:80'

volumes:
  postgres-data:
  redis-data:
  blob-data:
  mailpit-data:
